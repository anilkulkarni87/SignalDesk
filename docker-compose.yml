services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SIGNALDESK_ACCESS_CODE: ${SIGNALDESK_ACCESS_CODE:?Set SIGNALDESK_ACCESS_CODE}
      SIGNALDESK_SESSION_SECRET: ${SIGNALDESK_SESSION_SECRET:?Set SIGNALDESK_SESSION_SECRET}
      SIGNALDESK_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      SIGNALDESK_COOKIE_SECURE: "false"
    ports:
      - "8001:8001"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/warehouse:/data/warehouse:ro
      - signaldesk_runtime:/app/data/runtime
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SIGNALDESK_API_URL: http://127.0.0.1:8001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  signaldesk_runtime:
