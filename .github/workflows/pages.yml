name: Deploy SignalDesk Journey

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "course/**"
      - "docs/blog/**"
      - "scripts/build_site.py"
      - "site/**"
      - "requirements-site.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: python -m pip install -r requirements-site.txt pytest==9.0.2
      - run: python -m pytest tests/site -q
      - run: python scripts/build_site.py --base-url /SignalDesk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
